<script>
(()=>{
const $=i=>document.getElementById(i),cv=$('g'),c=cv.getContext('2d',{alpha:false}),CY='#19f0ff',PU='#a45cff',DT=210;
let S={best:0,bestDist:0,sfx:0,fx:1,vib:1,coins:0,eq:'shield',dtap:'turbo',spd:0,bx:.86,by:.55};
try{Object.assign(S,JSON.parse(localStorage.getItem('line.v1')||'{}'))}catch(e){}
S.inv=S.inv||{};S.coins=S.coins|0;
const save=()=>{try{localStorage.setItem('line.v1',JSON.stringify(S))}catch(e){}};
let W,H,s,dpr,LX=[0,0],PY,state='home';

function rs(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr|0;cv.height=H*dpr|0;s=Math.min(W/360,H/640,1.5);LX=[W/2-62*s,W/2+62*s];PY=H*.76;c.setTransform(dpr,0,0,dpr,0,0);if(state!=='play')px=LX[lane]}
addEventListener('resize',rs);addEventListener('orientationchange',rs);rs();
const st=[];for(let i=0;i<28;i++)st.push({x:Math.random(),y:Math.random(),v:.2+Math.random()*.8,a:.1+Math.random()*.3,z:1+(Math.random()<.2)});
const P=[];for(let i=0;i<80;i++)P.push({x:0,y:0,vx:0,vy:0,l:0,m:1,c:'#fff',z:2});let pi=0;
function em(x,y,vx,vy,l,col,force){if(!S.fx&&!force)return;const p=P[pi=(pi+1)%80];p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.l=p.m=l;p.c=col}
const burst=(x,y,n,col,sp,f)=>{for(let i=0;i<n;i++){const a=Math.random()*6.283,v=(.3+Math.random())*sp*s;em(x,y,Math.cos(a)*v,Math.sin(a)*v,.4+Math.random()*.5,col,f)}};
let ac;function beep(f,d,tp,v,f2){if(!S.sfx)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=tp||'sine';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v||.04,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d)}catch(e){}}
const vib=n=>{if(S.vib&&navigator.vibrate)try{navigator.vibrate(n)}catch(e){}};
const MUL=[1,2,3,4,5],SPN=['NORMAL','X2','X3 FAST','X4 HARD','X5 INSANE'],capPx=()=>(PY+30*s)/.6,bs=()=>Math.min((230+Math.min(t,150)*2.6)*s*MUL[S.spd|0],capPx()),Q=()=>t*Math.sqrt(MUL[S.spd|0]),meters=()=>Math.floor(dist/(s*20));
function reset(){lane=0;px=LX[0];dist=pts=t=0;tm=1;turboT=cdT=0;slow=mag=shield=prot=dbl=bonus=0;pwCool=4;lastPw='';$('pw').textContent='';gap=H*.3;lastLane=0;obs=[];pk=[];tr=[];fl=0;lastSc=-1;P.forEach(p=>p.l=0)}
function spawn(b){const q=Q(),lv=Math.min(q/12,12);gap=Math.max(.62-Math.max(0,(S.spd|0)-2)*.035,1.2-lv*.05)*b;const r=Math.random();let ty=0;
 if(q>10&&r<Math.min(.4,(q-10)/80))ty=1;else if(q>22&&r>1-Math.min(.35,(q-22)/90))ty=2;
 const ln=Math.random()<.6?1-lastLane:lastLane;lastLane=ln;
 obs.push({y:-30*s,ty,lane:ln,x:LX[ln],ph:Math.random()*6.28,f:.8+Math.random()*.4,lk:0});
 pwCool--;const l=Math.random()<.5?0:1;
 if(t>8&&pwCool<=0&&Math.random()<.4){pwCool=9;pk.push({y:-30*s-gap/2,x:LX[l],ty:1+(Math.random()*3|0)})}
 else if(Math.random()<.65)pk.push({y:-30*s-gap/2,x:LX[l],ty:0})}
function update(dt){
 t+=dt;const b=bs(),lv=Math.min(Q()/12,12);tm+=(Math.min(turboT>0?1.7:1,1.3*capPx()/b)*(slow>0?.6:1)-tm)*Math.min(1,dt*6);if(prot>0)prot=Math.max(0,prot-dt);if(dbl>0)dbl=Math.max(0,dbl-dt);if(slow>0)slow=Math.max(0,slow-dt);if(mag>0)mag=Math.max(0,mag-dt);const dy=b*tm*dt;dist+=dy;
 if(turboT>0){turboT-=dt;if(turboT<=0){turboT=0;cdT=6}}else if(cdT>0)cdT=Math.max(0,cdT-dt);
 px+=(LX[lane]-px)*Math.min(1,dt*22);gap-=dy;if(gap<=0)spawn(b);
 tr.unshift({x:px,y:PY});const L=(turboT>0?260:140)*s;for(const q of tr)q.y+=dy;while(tr.length&&tr[tr.length-1].y>PY+L)tr.pop();
 em(px+(Math.random()-.5)*6*s,PY+14*s,(Math.random()-.5)*30*s,(60+Math.random()*60)*s,.5,turboT>0?CY:'#fff');
 if(turboT>0)em(px,PY+10*s,(Math.random()-.5)*80*s,150*s,.5,PU);
 for(let i=obs.length-1;i>=0;i--){const o=obs[i];o.y+=dy;
  if(!o.lk&&PY-o.y<b*Math.min(.9,(PY+30*s)/b-.05)){o.lk=1;if(o.ty===1)o.lane=o.x<(LX[0]+LX[1])/2?0:1}
  if(o.ty===1&&!o.lk){o.ph+=dt*(2+lv*.1);o.x=LX[0]+(LX[1]-LX[0])*(.5+.5*Math.sin(o.ph))}
  else{if(o.ty===2&&!o.lk){o.f-=dt;if(o.f<=0){o.lane^=1;o.f=Math.max(.45,.9-lv*.04)}}o.x+=(LX[o.lane]-o.x)*Math.min(1,dt*16)}
  if(Math.abs(o.y-PY)<17*s&&Math.abs(o.x-px)<48*s){if(prot>0||shield){if(prot<=0)shield=0;obs.splice(i,1);burst(o.x,o.y,30,'#fff',240,1);burst(o.x,o.y,14,o.ty===1?PU:CY,200,1);fl=.35;beep(140,.3,'square',.04,500);vib(40);continue}die();return}
  if(o.y>H+40)obs.splice(i,1)}
 for(let i=pk.length-1;i>=0;i--){const k=pk[i];k.y+=dy;
  if(mag>0&&!k.ty&&Math.abs(k.y-PY)<280*s){k.x+=(px-k.x)*Math.min(1,dt*7);k.y+=(PY-k.y)*Math.min(1,dt*2.5)}
  if(Math.abs(k.y-PY)<20*s&&Math.abs(k.x-px)<22*s){if(!k.ty){pts++;if(dbl>0)bonus++;burst(k.x,k.y,10,CY,140);beep(880,.12,'sine',.035,1320);vib(8)}else{if(k.ty===1)slow=5;else if(k.ty===2)mag=8;else shield=1;burst(k.x,k.y,18,k.ty===1?PU:k.ty===2?CY:'#fff',180);beep(520,.25,'triangle',.04,1040);vib(20)}pk.splice(i,1)}else if(k.y>H+30)pk.splice(i,1)}
}
function sw(){if(state==='play'){lane^=1;beep(300,.05,'triangle',.02)}}
function turbo(){if(state==='play'&&turboT<=0&&cdT<=0){turboT=3;burst(px,PY,16,CY,200);beep(220,.35,'sawtooth',.03,660);vib(15)}}
function tap(){if(state!=='play')return;if(tapTimer){clearTimeout(tapTimer);tapTimer=0;(S.dtap==='item'?useItem:turbo)()}else tapTimer=setTimeout(()=>{tapTimer=0;sw()},DT)}
const tapClear=()=>{clearTimeout(tapTimer);tapTimer=0};
let prev=0;
function die(){state='dead';tapClear();fl=1;vib(70);beep(200,.45,'sawtooth',.05,35);burst(px,PY,45,'#fff',260,1);burst(px,PY,25,PU,200,1);
 const m=meters(),sc=m+pts*10,old=S.best,nb=sc>old;if(nb)S.best=sc;S.bestDist=Math.max(S.bestDist||0,m);S.coins+=pts+bonus;if(sc>(S.lbBest||0)&&(!S.pend||sc>S.pend.score))S.pend={score:sc,dist:m,pts,time:Math.floor(t)};save();submit();$('lbo').textContent=S.name?'BOARD':'JOIN';
 $('os').textContent=sc;$('od').textContent=m+' M  ·  ◆ +'+(pts+bonus);$('ob').textContent=nb?'NEW PERSONAL BEST':'BEST '+old;$('ob').className=nb?'nb':'';
 clearTimeout(tmr);tmr=setTimeout(()=>{if(state==='dead')go('over')},700)}
function go(n){state=n;tapClear();clearTimeout(tmr);
 for(const i of['home','pause','over','sets','lb','shop'])$(i).classList.toggle('on',i===(n==='settings'?'sets':n));
 $('hud').classList.toggle('on',n==='play'||n==='pause'||n==='dead');$('tw').classList.toggle('on',n==='play'||n==='pause'||n==='dead');$('pbtn').classList.toggle('on',n==='play');
 if(n==='home'){reset();$('hb').textContent='◆ '+S.coins+'  ·  '+(S.best?'BEST  '+S.best:'TAP TO SWITCH LANES')}}
function start(){reset();go('play');const h=$('hint');if(!S.best){h.classList.add('on');setTimeout(()=>h.classList.remove('on'),4500)}}
function pause(){if(state==='play')go('pause')}
function pw(k,r){const col=k.ty===1?PU:k.ty===2?CY:'#fff';c.fillStyle=col;c.globalAlpha=.18;c.beginPath();c.arc(k.x,k.y,r*1.7,0,6.283);c.fill();c.strokeStyle=col;c.globalAlpha=.95;c.lineWidth=2*s;c.beginPath();
 if(k.ty===1){c.arc(k.x,k.y,r,0,6.283);c.moveTo(k.x,k.y-r*.6);c.lineTo(k.x,k.y);c.lineTo(k.x+r*.45,k.y+r*.2)}
 else if(k.ty===2){c.arc(k.x,k.y,r*.7,0,Math.PI);c.moveTo(k.x-r*.7,k.y);c.lineTo(k.x-r*.7,k.y-r*.7);c.moveTo(k.x+r*.7,k.y);c.lineTo(k.x+r*.7,k.y-r*.7)}
 else{for(let i=0;i<6;i++){const a=i*1.047-1.57;c[i?'lineTo':'moveTo'](k.x+Math.cos(a)*r,k.y+Math.sin(a)*r)}c.closePath()}c.stroke()}
function ringfx(now){if(prot>0){c.globalAlpha=.55+.25*Math.sin(now*10);c.strokeStyle=CY;c.lineWidth=3*s;c.beginPath();c.arc(px,PY,30*s,0,6.283);c.stroke()}if(shield){c.globalAlpha=.5+.2*Math.sin(now*8);c.strokeStyle='#fff';c.lineWidth=2*s;c.beginPath();c.arc(px,PY,26*s,0,6.283);c.stroke()}
 if(mag>0){c.globalAlpha=.25;c.strokeStyle=CY;c.lineWidth=1.5*s;c.beginPath();c.arc(px,PY,(40+(now*60)%40)*s,0,6.283);c.stroke()}}
function glow(w,col,fn){c.strokeStyle=col;c.lineCap='round';c.globalAlpha=.1;c.lineWidth=w*4;fn();c.globalAlpha=.22;c.lineWidth=w*2;fn();c.globalAlpha=1;c.lineWidth=w;fn()}
function rect(x,y,w,h,col,a){c.fillStyle=col;c.globalAlpha=.12;c.fillRect(x-w/2-7*s,y-h/2-7*s,w+14*s,h+14*s);c.globalAlpha=a;c.fillRect(x-w/2,y-h/2,w,h);c.globalAlpha=.6;c.fillStyle='#fff';c.fillRect(x-w/2,y-h/2,w,2*s)}
function draw(dt){
 const now=performance.now()/1000;c.globalCompositeOperation='source-over';c.globalAlpha=1;c.fillStyle='#000';c.fillRect(0,0,W,H);
 if(slow>0){c.globalAlpha=.07;c.fillStyle=PU;c.fillRect(0,0,W,H)}
 c.fillStyle='#fff';for(const q of st){q.y+=q.v*dt*H*(.15+tm*.4);if(q.y>1)q.y=0;c.globalAlpha=q.a;c.fillRect(q.x*W,q.y*H,q.z*s,q.z*s*3)}
 c.globalAlpha=.1;c.strokeStyle='#fff';c.lineWidth=1;c.setLineDash([14*s,16*s]);c.lineDashOffset=-(dist%(30*s));
 for(const x of LX){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}c.setLineDash([]);
 c.globalCompositeOperation='lighter';const w=96*s,h=18*s;
 for(const o of obs){
  if(o.ty===1&&!o.lk){c.globalAlpha=.12;c.fillStyle=PU;c.fillRect(LX[0],o.y-1,LX[1]-LX[0],2)}
  if(o.ty===2&&!o.lk){c.globalAlpha=o.f<.3?.3+.3*Math.sin(now*40):.14;c.strokeStyle=o.lane?CY:PU;c.lineWidth=1.5;c.strokeRect(LX[o.lane^1]-w/2,o.y-h/2,w,h)}
  rect(o.x,o.y,w,h,o.ty===0?CY:o.ty===1?PU:(o.lane?PU:CY),.85)}
 for(const k of pk){const r=(1+.15*Math.sin(now*6))*8*s;if(k.ty){pw(k,r*1.5);continue}c.fillStyle=CY;c.globalAlpha=.2;c.beginPath();c.arc(k.x,k.y,r*1.8,0,6.283);c.fill();c.globalAlpha=.95;c.fillStyle='#fff';c.beginPath();c.moveTo(k.x,k.y-r);c.lineTo(k.x+r*.7,k.y);c.lineTo(k.x,k.y+r);c.lineTo(k.x-r*.7,k.y);c.fill()}
 if(state!=='dead'){
  const pts2=tr.length>1?tr:[{x:px,y:PY},{x:px,y:PY+130*s}],ly=pts2[pts2.length-1].y,g=c.createLinearGradient(0,PY,0,ly+1);
  g.addColorStop(0,turboT>0?CY:'#fff');g.addColorStop(1,'rgba(164,92,255,0)');
