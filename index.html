<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>LINE</title>
<style>
:root{--c:#19f0ff;--p:#a45cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
#g{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(env(safe-area-inset-top) + 14px) 18px 0;pointer-events:none;opacity:0;transition:opacity .3s}
#hud.on{opacity:1}#hud b{display:block;font-size:30px;font-weight:200;letter-spacing:.05em}
#hud small,#ds{font-size:12px;letter-spacing:.25em;opacity:.6}#ds{padding-top:10px}#pp{color:var(--c)}
#pb{pointer-events:auto;background:none;border:1px solid #fff3;color:#fff;width:42px;height:42px;border-radius:50%;font-size:11px;letter-spacing:1px}
#tw{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);width:min(220px,60vw);transform:translateX(-50%);opacity:0;transition:opacity .3s;pointer-events:none}
#tw.on{opacity:1}#tb{height:3px;background:#fff2}#tf{display:block;height:100%;transform-origin:left;background:#fff;box-shadow:0 0 10px #fff}
#tl{font-size:10px;letter-spacing:.3em;margin-top:8px;text-align:center;opacity:.6}
#tw.act #tf{background:var(--c);box-shadow:0 0 14px var(--c)}#tw.cd #tf{background:var(--p);box-shadow:none}#tw.cd #tl{opacity:.35}
#hint{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:12px;letter-spacing:.3em;line-height:2.2;opacity:0;transition:opacity .6s;pointer-events:none;color:#fffa}
#hint.on{opacity:1}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000a;padding:20px;text-align:center}
.scr.on{display:flex;animation:in .35s ease}@keyframes in{from{opacity:0;transform:scale(.98)}}
h1{margin:0 0 4px;font-size:clamp(64px,22vw,110px);font-weight:100;letter-spacing:.25em;margin-right:-.25em;text-shadow:0 0 18px #fff,0 0 50px var(--c),0 0 90px var(--p)}
h2{margin:0 0 6px;font-weight:200;letter-spacing:.3em;font-size:22px}
p{margin:0;font-size:12px;letter-spacing:.3em;opacity:.65}.big{font-size:64px;font-weight:100;text-shadow:0 0 24px var(--c)}
.nb{color:var(--c);opacity:1}
.b{width:min(240px,70vw);padding:15px 0;background:none;color:#fff;border:1px solid #fff5;border-radius:3px;font-size:13px;letter-spacing:.35em;text-indent:.35em;transition:.15s}
.b:hover,.b:active{background:#fff1;border-color:var(--c);box-shadow:0 0 18px #19f0ff44}.b.pr{border-color:#fff;box-shadow:0 0 18px #fff3}
</style></head><body>
<canvas id="g"></canvas>
<div id="hud"><div><b id="sc">0</b><small id="pp">◆ 0</small></div><div id="ds">0 M</div><button id="pb" aria-label="Pause">II</button></div>
<div id="hint">TAP · SWITCH LANE<br>DOUBLE-TAP · TURBO</div>
<div id="tw"><div id="tb"><i id="tf"></i></div><div id="tl"></div></div>
<section class="scr on" id="home"><h1>LINE</h1><p id="hb"></p><br><button class="b pr" id="play">PLAY</button><button class="b" id="set">SETTINGS</button><p style="margin-top:18px;font-size:10px">TAP · LANE &nbsp;&nbsp; DOUBLE-TAP · TURBO</p></section>
<section class="scr" id="pause"><h2>PAUSED</h2><button class="b pr" id="res">RESUME</button><button class="b" id="hm1">HOME</button></section>
<section class="scr" id="over"><h2>GAME OVER</h2><div class="big" id="os">0</div><p id="od"></p><p id="ob"></p><br><button class="b pr" id="rs">RESTART</button><button class="b" id="hm2">HOME</button></section>
<section class="scr" id="sets"><h2>SETTINGS</h2><button class="b" id="tsfx"></button><button class="b" id="tfx"></button><button class="b" id="tvib"></button><button class="b" id="rst">RESET BEST</button><button class="b pr" id="bk">BACK</button><p style="font-size:10px">NO MUSIC · FX ARE OFF BY DEFAULT</p></section>
<script>
(()=>{
const $=i=>document.getElementById(i),cv=$('g'),c=cv.getContext('2d',{alpha:false}),CY='#19f0ff',PU='#a45cff',DT=210;
let S={best:0,bestDist:0,sfx:0,fx:1,vib:1};
try{Object.assign(S,JSON.parse(localStorage.getItem('line.v1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('line.v1',JSON.stringify(S))}catch(e){}};
let W,H,s,dpr,LX=[0,0],PY,state='home';
let lane=0,px=0,dist=0,pts=0,t=0,tm=1,turboT=0,cdT=0,gap=0,lastLane=0,obs=[],pk=[],tr=[],fl=0,rp=[],tapTimer=0,lastSc=-1,tmr=0;
function rs(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr|0;cv.height=H*dpr|0;s=Math.min(W/360,H/640,1.5);LX=[W/2-62*s,W/2+62*s];PY=H*.76;c.setTransform(dpr,0,0,dpr,0,0);if(state!=='play')px=LX[lane]}
addEventListener('resize',rs);addEventListener('orientationchange',rs);rs();
const st=[];for(let i=0;i<28;i++)st.push({x:Math.random(),y:Math.random(),v:.2+Math.random()*.8,a:.1+Math.random()*.3,z:1+(Math.random()<.2)});
const P=[];for(let i=0;i<80;i++)P.push({x:0,y:0,vx:0,vy:0,l:0,m:1,c:'#fff',z:2});let pi=0;
function em(x,y,vx,vy,l,col,force){if(!S.fx&&!force)return;const p=P[pi=(pi+1)%80];p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.l=p.m=l;p.c=col}
const burst=(x,y,n,col,sp,f)=>{for(let i=0;i<n;i++){const a=Math.random()*6.283,v=(.3+Math.random())*sp*s;em(x,y,Math.cos(a)*v,Math.sin(a)*v,.4+Math.random()*.5,col,f)}};
let ac;function beep(f,d,tp,v,f2){if(!S.sfx)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=tp||'sine';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v||.04,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d)}catch(e){}}
const vib=n=>{if(S.vib&&navigator.vibrate)try{navigator.vibrate(n)}catch(e){}};
const bs=()=>(230+Math.min(t,150)*2.6)*s, meters=()=>Math.floor(dist/(s*20));
function reset(){lane=0;px=LX[0];dist=pts=t=0;tm=1;turboT=cdT=0;gap=H*.3;lastLane=0;obs=[];pk=[];tr=[];fl=0;lastSc=-1;P.forEach(p=>p.l=0)}
function spawn(b){const lv=Math.min(t/12,12);gap=Math.max(.62,1.2-lv*.05)*b;const r=Math.random();let ty=0;
 if(t>10&&r<Math.min(.4,(t-10)/80))ty=1;else if(t>22&&r>1-Math.min(.35,(t-22)/90))ty=2;
 const ln=Math.random()<.6?1-lastLane:lastLane;lastLane=ln;
 obs.push({y:-30*s,ty,lane:ln,x:LX[ln],ph:Math.random()*6.28,f:.8+Math.random()*.4,lk:0});
 if(Math.random()<.65){const l=Math.random()<.5?0:1;pk.push({y:-30*s-gap/2,x:LX[l]})}}
function update(dt){
 t+=dt;const b=bs(),lv=Math.min(t/12,12);tm+=((turboT>0?1.7:1)-tm)*Math.min(1,dt*6);const dy=b*tm*dt;dist+=dy;
 if(turboT>0){turboT-=dt;if(turboT<=0){turboT=0;cdT=6}}else if(cdT>0)cdT=Math.max(0,cdT-dt);
 px+=(LX[lane]-px)*Math.min(1,dt*22);gap-=dy;if(gap<=0)spawn(b);
 tr.unshift({x:px,y:PY});const L=(turboT>0?260:140)*s;for(const q of tr)q.y+=dy;while(tr.length&&tr[tr.length-1].y>PY+L)tr.pop();
 em(px+(Math.random()-.5)*6*s,PY+14*s,(Math.random()-.5)*30*s,(60+Math.random()*60)*s,.5,turboT>0?CY:'#fff');
 if(turboT>0)em(px,PY+10*s,(Math.random()-.5)*80*s,150*s,.5,PU);
 for(let i=obs.length-1;i>=0;i--){const o=obs[i];o.y+=dy;
  if(!o.lk&&PY-o.y<b*.9){o.lk=1;if(o.ty===1)o.lane=o.x<(LX[0]+LX[1])/2?0:1}
  if(o.ty===1&&!o.lk){o.ph+=dt*(2+lv*.1);o.x=LX[0]+(LX[1]-LX[0])*(.5+.5*Math.sin(o.ph))}
  else{if(o.ty===2&&!o.lk){o.f-=dt;if(o.f<=0){o.lane^=1;o.f=Math.max(.45,.9-lv*.04)}}o.x+=(LX[o.lane]-o.x)*Math.min(1,dt*16)}
  if(Math.abs(o.y-PY)<17*s&&Math.abs(o.x-px)<48*s){die();return}
  if(o.y>H+40)obs.splice(i,1)}
 for(let i=pk.length-1;i>=0;i--){const k=pk[i];k.y+=dy;
  if(Math.abs(k.y-PY)<20*s&&Math.abs(k.x-px)<22*s){pts++;burst(k.x,k.y,10,CY,140);beep(880,.12,'sine',.035,1320);vib(8);pk.splice(i,1)}else if(k.y>H+30)pk.splice(i,1)}
}
function sw(){if(state==='play'){lane^=1;beep(300,.05,'triangle',.02)}}
function turbo(){if(state==='play'&&turboT<=0&&cdT<=0){turboT=3;burst(px,PY,16,CY,200);beep(220,.35,'sawtooth',.03,660);vib(15)}}
function tap(){if(state!=='play')return;if(tapTimer){clearTimeout(tapTimer);tapTimer=0;turbo()}else tapTimer=setTimeout(()=>{tapTimer=0;sw()},DT)}
const tapClear=()=>{clearTimeout(tapTimer);tapTimer=0};
let prev=0;
function die(){state='dead';tapClear();fl=1;vib(70);beep(200,.45,'sawtooth',.05,35);burst(px,PY,45,'#fff',260,1);burst(px,PY,25,PU,200,1);
 const m=meters(),sc=m+pts*10,old=S.best,nb=sc>old;if(nb)S.best=sc;S.bestDist=Math.max(S.bestDist||0,m);save();
 $('os').textContent=sc;$('od').textContent=m+' M  ·  ◆ '+pts;$('ob').textContent=nb?'NEW PERSONAL BEST':'BEST '+old;$('ob').className=nb?'nb':'';
 clearTimeout(tmr);tmr=setTimeout(()=>{if(state==='dead')go('over')},700)}
function go(n){state=n;tapClear();clearTimeout(tmr);
 for(const i of['home','pause','over','sets'])$(i).classList.toggle('on',i===(n==='settings'?'sets':n));
 $('hud').classList.toggle('on',n==='play'||n==='pause'||n==='dead');$('tw').classList.toggle('on',n==='play'||n==='pause'||n==='dead');
 if(n==='home'){reset();$('hb').textContent=S.best?'BEST  '+S.best+'  ·  '+S.bestDist+' M':'TAP TO SWITCH LANES'}}
function start(){reset();go('play');const h=$('hint');if(!S.best){h.classList.add('on');setTimeout(()=>h.classList.remove('on'),4500)}}
function pause(){if(state==='play')go('pause')}
function glow(w,col,fn){c.strokeStyle=col;c.lineCap='round';c.globalAlpha=.1;c.lineWidth=w*4;fn();c.globalAlpha=.22;c.lineWidth=w*2;fn();c.globalAlpha=1;c.lineWidth=w;fn()}
function rect(x,y,w,h,col,a){c.fillStyle=col;c.globalAlpha=.12;c.fillRect(x-w/2-7*s,y-h/2-7*s,w+14*s,h+14*s);c.globalAlpha=a;c.fillRect(x-w/2,y-h/2,w,h);c.globalAlpha=.6;c.fillStyle='#fff';c.fillRect(x-w/2,y-h/2,w,2*s)}
function draw(dt){
 const now=performance.now()/1000;c.globalCompositeOperation='source-over';c.globalAlpha=1;c.fillStyle='#000';c.fillRect(0,0,W,H);
 c.fillStyle='#fff';for(const q of st){q.y+=q.v*dt*H*(.15+tm*.4);if(q.y>1)q.y=0;c.globalAlpha=q.a;c.fillRect(q.x*W,q.y*H,q.z*s,q.z*s*3)}
 c.globalAlpha=.1;c.strokeStyle='#fff';c.lineWidth=1;c.setLineDash([14*s,16*s]);c.lineDashOffset=-(dist%(30*s));
 for(const x of LX){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}c.setLineDash([]);
 c.globalCompositeOperation='lighter';const w=96*s,h=18*s;
 for(const o of obs){
  if(o.ty===1&&!o.lk){c.globalAlpha=.12;c.fillStyle=PU;c.fillRect(LX[0],o.y-1,LX[1]-LX[0],2)}
  if(o.ty===2&&!o.lk){c.globalAlpha=o.f<.3?.3+.3*Math.sin(now*40):.14;c.strokeStyle=o.lane?CY:PU;c.lineWidth=1.5;c.strokeRect(LX[o.lane^1]-w/2,o.y-h/2,w,h)}
  rect(o.x,o.y,w,h,o.ty===0?CY:o.ty===1?PU:(o.lane?PU:CY),.85)}
 for(const k of pk){const r=(1+.15*Math.sin(now*6))*8*s;c.fillStyle=CY;c.globalAlpha=.2;c.beginPath();c.arc(k.x,k.y,r*1.8,0,6.283);c.fill();c.globalAlpha=.95;c.fillStyle='#fff';c.beginPath();c.moveTo(k.x,k.y-r);c.lineTo(k.x+r*.7,k.y);c.lineTo(k.x,k.y+r);c.lineTo(k.x-r*.7,k.y);c.fill()}
 if(state!=='dead'){
  const pts2=tr.length>1?tr:[{x:px,y:PY},{x:px,y:PY+130*s}],ly=pts2[pts2.length-1].y,g=c.createLinearGradient(0,PY,0,ly+1);
  g.addColorStop(0,turboT>0?CY:'#fff');g.addColorStop(1,'rgba(164,92,255,0)');
  glow(3*s,g,()=>{c.beginPath();c.moveTo(pts2[0].x,pts2[0].y);for(let i=1;i<pts2.length;i++)c.lineTo(pts2[i].x,pts2[i].y);c.stroke()});
  const k=turboT>0?1.5:1+.08*Math.sin(now*5);glow(4*s*k,turboT>0?'#bff':'#fff',()=>{c.beginPath();c.moveTo(px,PY-15*s);c.lineTo(px,PY+15*s);c.stroke()})}
 for(const p of P)if(p.l>0){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;c.globalAlpha=Math.max(0,p.l/p.m);c.fillStyle=p.c;c.fillRect(p.x,p.y,p.z*s,p.z*s)}
 c.globalCompositeOperation='source-over';
 for(let i=rp.length-1;i>=0;i--){const r=rp[i];r.t+=dt;if(r.t>.4){rp.splice(i,1);continue}c.globalAlpha=.35*(1-r.t/.4);c.strokeStyle='#fff';c.lineWidth=1.5;c.beginPath();c.arc(r.x,r.y,(10+r.t*80)*s,0,6.283);c.stroke()}
 if(fl>0){c.globalAlpha=fl*.45;c.fillStyle='#fff';c.fillRect(0,0,W,H);fl-=dt*3}c.globalAlpha=1;
 if(state==='play'||state==='dead'){const sc=meters()+pts*10;if(sc!==lastSc){lastSc=sc;$('sc').textContent=sc;$('ds').textContent=meters()+' M';$('pp').textContent='◆ '+pts}
  const tw=$('tw'),cl=turboT>0?'act':cdT>0?'cd':'';if(tw._c!==cl){tw._c=cl;tw.className='on '+cl;$('tl').textContent=cl==='act'?'TURBO':cl==='cd'?'RECHARGING':'TURBO READY · DOUBLE-TAP'}
  $('tf').style.transform='scaleX('+(turboT>0?turboT/3:cdT>0?1-cdT/6:1)+')'}
}
function loop(ts){const dt=Math.min(.05,(ts-prev)/1000||0);prev=ts;if(state==='play')update(dt);draw(state==='pause'?0:dt);requestAnimationFrame(loop)}
requestAnimationFrame(ts=>{prev=ts;loop(ts)});
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='play'){rp.push({x:e.clientX,y:e.clientY,t:0});if(rp.length>4)rp.shift();tap()}});
addEventListener('keydown',e=>{const k=e.key;if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(k))e.preventDefault();if(e.repeat)return;
 if(state==='play'){if(k==='ArrowLeft'||k==='a')lane=0;else if(k==='ArrowRight'||k==='d')lane=1;else if(k===' ')sw();else if(k==='ArrowUp'||k==='Shift'||k==='t')turbo();else if(k==='p'||k==='Escape')pause()}
 else if(state==='pause'&&(k==='p'||k==='Escape'||k==='Enter'))go('play');else if((state==='home'||state==='over')&&(k==='Enter'||k===' '))start()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});addEventListener('blur',pause);
const on=(i,f)=>$(i).addEventListener('click',f);
on('play',start);on('rs',start);on('pb',pause);on('res',()=>go('play'));on('hm1',()=>go('home'));on('hm2',()=>go('home'));on('set',()=>{lab();go('settings')});on('bk',()=>go('home'));
const lab=()=>{$('tsfx').textContent='SOUND FX  '+(S.sfx?'ON':'OFF');$('tfx').textContent='EFFECTS  '+(S.fx?'ON':'OFF');$('tvib').textContent='VIBRATION  '+(S.vib?'ON':'OFF')};
on('tsfx',()=>{S.sfx^=1;save();lab();beep(660,.1)});on('tfx',()=>{S.fx^=1;save();lab()});on('tvib',()=>{S.vib^=1;save();lab();vib(20)});
on('rst',()=>{if(confirm('Reset personal best?')){S.best=S.bestDist=0;save();$('hb').textContent='TAP TO SWITCH LANES'}});
go('home');
window.LINE={start,sw,turbo,die,get state(){return state},get obs(){return obs},get lane(){return lane},get t(){return t},get pts(){return pts},get turboT(){return turboT},get cdT(){return cdT},get tm(){return tm},get S(){return S},step:update,PY:()=>PY,bs,tap,s:()=>s};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script></body></html>
